<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Redirecionando...</title>
<meta http-equiv="refresh" content="0; url=https://4dcorra.github.io/ferramentas/">
<link rel="canonical" href="https://4dcorra.github.io/ferramentas/">
<script>
  // Preserva fragmento e query string ao redirecionar
  var dest = 'https://4dcorra.github.io/ferramentas/';
  var s = window.location.search || '';
  var h = window.location.hash || '';
  window.location.replace(dest + s + h);
</script>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 60px 20px;
    text-align: center;
    color: #4b5563;
    background: #f3f4f6;
    margin: 0;
  }
  .box {
    max-width: 480px;
    margin: 0 auto;
    background: white;
    padding: 36px 28px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  h1 { font-size: 18px; color: #1f2937; margin: 0 0 12px 0; }
  p { line-height: 1.55; margin: 8px 0; font-size: 14px; }
  a { color: #1a3a6b; word-break: break-all; }
  .small { font-size: 12px; color: #9ca3af; margin-top: 18px; }
</style>
</head>
<body>
<div class="box">
  <h1>Esta página foi movida</h1>
  <p>Redirecionando automaticamente para o novo endereço...</p>
  <p>Se nada acontecer em alguns segundos, clique abaixo:</p>
  <p><a href="https://4dcorra.github.io/ferramentas/">https://4dcorra.github.io/ferramentas/</a></p>
  <p class="small">Atualize seus favoritos para o novo link.</p>
</div>
</body>
</html>
